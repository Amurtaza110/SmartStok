{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Edit{% else %}Add{% endif %} Category{% endblock %}
{% block page_title %}{% if object %}Edit{% else %}New{% endif %} Category{% endblock %}

{% block content %}
<div style="max-width:480px">
  <a href="{% url 'category-list' %}" style="color:var(--ss-muted);font-size:.875rem">
    <i class="bi bi-arrow-left me-1"></i>Back to Categories
  </a>
  <div class="ss-card mt-3">
    {% crispy form %}
  </div>
</div>
{% endblock %}
