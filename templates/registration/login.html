{% extends "base.html" %}
{% block title %}Login — SmartStock{% endblock %}

{% block content %}
<div style="width:100%;max-width:420px;margin:auto;padding:1rem">
  <!-- Logo -->
  <div class="text-center mb-4">
    <div style="font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:#00d4ff;letter-spacing:-1px">
      <i class="bi bi-boxes me-2"></i>SmartStock
    </div>
    <div style="font-size:.75rem;color:var(--ss-muted);letter-spacing:2px;text-transform:uppercase">
      AI Inventory Management
    </div>
  </div>

  <div class="ss-card">
    <h5 class="mb-4" style="font-family:'Syne',sans-serif;font-weight:700">Sign In</h5>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label style="font-size:.82rem;color:var(--ss-muted);margin-bottom:.4rem;display:block">Username</label>
        <input type="text" name="username" class="form-control"
          style="background:rgba(255,255,255,.05);border-color:var(--ss-border);color:var(--ss-text)"
          placeholder="Enter username" autofocus required>
      </div>
      <div class="mb-4">
        <label style="font-size:.82rem;color:var(--ss-muted);margin-bottom:.4rem;display:block">Password</label>
        <input type="password" name="password" class="form-control"
          style="background:rgba(255,255,255,.05);border-color:var(--ss-border);color:var(--ss-text)"
          placeholder="Enter password" required>
      </div>

      {% if form.errors %}
      <div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);
                  border-radius:8px;padding:.6rem 1rem;font-size:.82rem;color:#f87171;margin-bottom:1rem">
        <i class="bi bi-x-circle me-1"></i>Invalid username or password.
      </div>
      {% endif %}

      <button type="submit" class="btn-ss-primary btn w-100" style="padding:.7rem">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="text-center mt-3" style="font-size:.82rem;color:var(--ss-muted)">
      Don't have an account?
      <a href="{% url 'register' %}" style="color:var(--ss-accent)">Register</a>
    </div>
  </div>

  <!-- Demo credentials hint -->
  <div class="mt-3 p-3" style="background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.15);border-radius:10px;font-size:.78rem;color:var(--ss-muted)">
    <i class="bi bi-info-circle me-1"></i>
    Default admin: <code style="color:var(--ss-accent)">admin</code> /
    <code style="color:var(--ss-accent)">admin123</code>
  </div>
</div>
{% endblock %}
